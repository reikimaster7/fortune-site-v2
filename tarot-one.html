
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロットからのメッセージ | Fortune Garden</title>

  <link rel="stylesheet" href="style.css">

  <script src="supabase-config.js" defer></script>
  <script src="tarot-one.js" defer></script>
</head>

<body>

  <header>
    <h1>🔮 タロットからのメッセージ</h1>
    <p>今のあなたに必要なヒント</p>
  </header>

  <main>
    <section class="tarot-section">
      <h2>占いたいテーマを選んでください</h2>

      <label for="categorySelect">占いカテゴリー</label>

      <select id="categorySelect" required>
        <option value="">選択してください</option>
        <option value="恋愛">❤️ 恋愛</option>
        <option value="仕事">💼 仕事</option>
        <option value="人生全般">🌿 人生全般</option>
        <option value="スピリチュアル">🔮 スピリチュアル</option>
      </select>

      <button id="drawBtn" type="button">
        🃏 カードを1枚引く
      </button>
    </section>

    <section id="resultSection" hidden>
      <h2>あなたのタロットカード</h2>

    
      <div id="cardResults" class="card-results one-card-results"></div>

    

      <div
        id="readingResult"
        class="reading-result"
        aria-live="polite">
      </div>
    </section>

    <p class="back-link">
      <a href="index.html">← 占いメニューに戻る</a>
    </p>
  </main>

  <footer>
    <p>© Fortune Garden</p>
  </footer>

</body>
</html>
